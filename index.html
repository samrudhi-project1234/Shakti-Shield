<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shakti Shield — Interactive Prototype</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Inter, Arial, sans-serif;
  background: #eef1f5;
  color: #172033;
}

button {
  font: inherit;
  cursor: pointer;
  border: 0;
}

.app {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

.phone {
  width: 390px;
  max-width: 100%;
  height: 820px;
  background: #f8fafc;
  border: 8px solid #111827;
  border-radius: 42px;
  overflow: hidden;
  box-shadow: 0 24px 70px #0002;
  position: relative;
}

.status {
  height: 30px;
  background: #111827;
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 18px;
  font-size: 11px;
}

.screen {
  height: calc(100% - 30px);
  overflow: auto;
  padding-bottom: 28px;
}

.top {
  padding: 22px 22px 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-weight: 800;
  font-size: 21px;
}

.logo span {
  color: #d7193f;
}

.avatar {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: #e7ebf2;
  display: grid;
  place-items: center;
  font-weight: 700;
}

.card {
  margin: 10px 18px;
  padding: 18px;
  border-radius: 22px;
  background: white;
  box-shadow: 0 5px 18px #17203310;
}

.welcome {
  font-size: 14px;
  color: #667085;
  margin-top: 4px;
}

.location {
  display: flex;
  gap: 10px;
  align-items: center;
  font-size: 13px;
  color: #667085;
}

.dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: #22a06b;
}

.sos-wrap {
  text-align: center;
  padding: 20px 0 8px;
}

.sos {
  width: 190px;
  height: 190px;
  border-radius: 50%;
  background: #d7193f;
  color: white;
  font-size: 28px;
  font-weight: 900;
  box-shadow: 0 14px 35px #d7193f55;
  border: 12px solid #f7c9d3;
}

.sos small {
  display: block;
  font-size: 12px;
  font-weight: 600;
  margin-top: 6px;
  opacity: .9;
}

.hint {
  text-align: center;
  color: #667085;
  font-size: 12px;
  margin: 8px 30px 18px;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin: 0 18px;
}

.mini {
  background: white;
  border-radius: 18px;
  padding: 15px;
  box-shadow: 0 5px 18px #17203310;
}

.mini b {
  display: block;
  margin-top: 7px;
  font-size: 14px;
}

.mini span {
  font-size: 12px;
  color: #667085;
}

.section-title {
  font-weight: 800;
  font-size: 15px;
  margin: 22px 18px 8px;
}

.contact {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.contact b {
  font-size: 14px;
}

.contact span {
  font-size: 12px;
  color: #667085;
}

.primary {
  width: 100%;
  padding: 14px;
  border-radius: 14px;
  background: #172033;
  color: #fff;
  font-weight: 700;
  margin-top: 12px;
}

.secondary {
  width: 100%;
  padding: 13px;
  border-radius: 14px;
  background: #eef1f5;
  color: #172033;
  font-weight: 700;
  margin-top: 9px;
}

.back {
  background: transparent;
  font-size: 20px;
}

.screen-title {
  font-weight: 800;
  font-size: 20px;
  flex: 1;
  text-align: center;
  margin-right: 25px;
}

.count {
  text-align: center;
  padding: 20px;
}

.count-num {
  font-size: 70px;
  font-weight: 900;
  color: #d7193f;
}

.warning {
  font-size: 14px;
  color: #667085;
  line-height: 1.5;
}

.statusbox {
  display: flex;
  justify-content: space-between;
  padding: 13px 0;
  border-bottom: 1px solid #edf0f4;
  font-size: 13px;
}

.ok {
  color: #16835b;
  font-weight: 700;
}

.map {
  height: 180px;
  border-radius: 18px;
  background: linear-gradient(135deg, #dfe9df, #edf2ea);
  position: relative;
  overflow: hidden;
  margin-top: 12px;
}

.road {
  position: absolute;
  height: 7px;
  background: #fff;
  transform: rotate(25deg);
  width: 140%;
  top: 75px;
}

.pin {
  position: absolute;
  left: 50%;
  top: 45%;
  font-size: 34px;
  transform: translate(-50%, -50%);
}

.success {
  margin: 28px 18px;
  text-align: center;
}

.check {
  width: 90px;
  height: 90px;
  border-radius: 50%;
  background: #dff4ea;
  color: #16835b;
  display: grid;
  place-items: center;
  font-size: 44px;
  margin: auto;
}

.success h2 {
  margin: 16px 0 6px;
}

.dash {
  background: #f4f6f9;
  min-height: 100%;
}

.dash .top {
  background: white;
}

.alert {
  margin: 14px 18px;
  background: white;
  border-radius: 20px;
  padding: 16px;
  border-left: 5px solid #d7193f;
  box-shadow: 0 5px 18px #17203310;
}

.alert-head {
  display: flex;
  justify-content: space-between;
  font-weight: 800;
}

.tag {
  font-size: 10px;
  background: #fde3e9;
  color: #b41135;
  padding: 5px 8px;
  border-radius: 20px;
}

.row {
  display: flex;
  justify-content: space-between;
  margin-top: 14px;
  font-size: 13px;
}

.response {
  background: #16835b;
  color: white;
  width: 100%;
  padding: 14px;
  border-radius: 13px;
  font-weight: 800;
  margin-top: 15px;
}

.safe {
  background: #e8eef5;
  color: #172033;
  width: 100%;
  padding: 13px;
  border-radius: 13px;
  font-weight: 700;
  margin-top: 8px;
}

.toast {
  position: absolute;
  left: 18px;
  right: 18px;
  bottom: 18px;
  background: #172033;
  color: white;
  padding: 13px 16px;
  border-radius: 14px;
  text-align: center;
  font-size: 13px;
  display: none;
  z-index: 10;
}

.nav {
  position: sticky;
  bottom: 0;
  background: white;
  border-top: 1px solid #e7eaf0;
  padding: 11px 18px;
  display: flex;
  justify-content: space-around;
  font-size: 11px;
  color: #667085;
}

.nav b {
  color: #172033;
}

.badge {
  display: inline-block;
  padding: 5px 9px;
  border-radius: 20px;
  background: #e8f6ef;
  color: #16835b;
  font-size: 11px;
  font-weight: 700;
}
</style>
</head>

<body>

<div class="app">

  <div class="phone">

    <div class="status">
      <span>9:41</span>
      <span>● ● ▮ 100%</span>
    </div>

    <div id="root"></div>

    <div id="toast" class="toast"></div>

  </div>

</div>


<script>

const root = document.getElementById("root");
const toast = document.getElementById("toast");


/* =========================
   NOTIFICATION
========================= */

function notify(message) {

  toast.textContent = message;

  toast.style.display = "block";

  setTimeout(() => {
    toast.style.display = "none";
  }, 2600);

}

   BOTTOM NAVIGATION
========================= */

function nav() {

  return `
    <div class="nav">

      <span>◉ Contacts</span>
      <span>◫ History</span>
      <span>⚙ Settings</span>
    </div>
  `;

}

/* =========================
   DOUBLE PRESS DEMO
========================= */

function simulateSideButton() {

  notify(
    "Double-press detected — starting SOS"
  );

  setTimeout(
    startSOS,
    700
  );

}


/* =========================
   EMERGENCY PIN
========================= */

function unlockDemo() {

  let pin = prompt(
    "Prototype PIN: enter 1234"
  );

  if (pin === "1234") {

    notify(
      "Emergency lock unlocked"
    );

  } else {

    notify(
      "Incorrect PIN"
    );

  }

}


/* =========================
   SOS COUNTDOWN
========================= */

function startSOS() {

  let n = 5;


  root.innerHTML = `

    <div class="screen">


      <div class="top">

        <button
          class="back"
          onclick="home()">

          ‹

        </button>


        <div class="screen-title">

          Emergency SOS

        </div>

      </div>


      <div class="count">

        <div
          class="count-num"
          id="counter">

          5

        </div>


        <h3>
          Emergency activation
        </h3>


        <p class="warning">

          Your trusted contacts will be
          notified with your available
          location and device status.

        </p>

      </div>


      <div class="card">


        <div class="statusbox">

          <span>
            Location
          </span>

          <b class="ok">
            Available
          </b>

        </div>


        <div class="statusbox">

          <span>
            Network
          </span>

          <b class="ok">
            Connected
          </b>

        </div>


        <div class="statusbox">

          <span>
            SMS fallback
          </span>

          <b class="ok">
            Ready
          </b>

        </div>


        <div class="statusbox">

          <span>
            Trusted contacts
          </span>

          <b>
            3
          </b>

        </div>


        <button
          class="secondary"
          onclick="home()">

          Cancel SOS

        </button>


      </div>


    </div>

  `;


  const timer = setInterval(() => {

    n--;

    let counter =
      document.getElementById(
        "counter"
      );


    if (counter) {

      counter.textContent = n;

    }


    if (n <= 0) {

      clearInterval(timer);

      activated();

    }

  }, 1000);

}
